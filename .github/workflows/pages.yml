name: Deploy ACA planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test planner
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build portable download
        env:
          ACA_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build_portable.py --site-url "$ACA_SITE_URL" --download-directory dist/downloads
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
